[build]
command = "node scripts/build-regions.js"
publish = "public"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[headers]]
for = "/admin.html"
  [headers.values]
  Cache-Control = "no-store"
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/.netlify/functions/*"
  [headers.values]
  Cache-Control = "no-store"

[[redirects]]
from = "/sitemap.xml"
to = "/.netlify/functions/sitemap"
status = 200
force = true

[functions."generate-batch-background"]
background = true

[functions."publish-mass-background"]
background = true

[functions."indexnow-background"]
background = true
